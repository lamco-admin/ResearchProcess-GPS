[package]
name = "meta-model-storage-postgres"
version = "0.1.0"
edition = "2021"

[dependencies]
# Storage abstraction
meta-model-storage = { path = "../meta-model-storage" }
meta-model-core = { path = "../meta-model-core" }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }

# Async
async-trait = "0.1"
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

[dev-dependencies]
testcontainers = "0.23"
tokio-test = "0.4"