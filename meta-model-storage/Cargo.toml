[package]
name = "meta-model-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Meta-model core
meta-model-core = { path = "../meta-model-core" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# Validation
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"