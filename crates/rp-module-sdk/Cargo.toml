[package]
name = "rp-module-sdk"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SDK for building ResearchProcess GPS modules"

[dependencies]
# Core dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Module types
rp-modules = { path = "../rp-modules" }

# Async runtime (optional for native modules)
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }
async-trait = { version = "0.1", optional = true }

# Logging
log = "0.4"
env_logger = { version = "0.11", optional = true }

# Error handling
thiserror = "2"
anyhow = "1"

[features]
default = ["native"]
native = ["tokio", "async-trait", "env_logger"]
wasm = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
