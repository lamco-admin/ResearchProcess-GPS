[package]
name = "research-log-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Dynamic library for loading

[dependencies]
# Core ResearchProcess-GPS dependencies
rp-core = { path = "../../crates/rp-core" }
rp-storage = { path = "../../crates/rp-storage" }
rp-events = { path = "../../crates/rp-events" }
rp-modules = { path = "../../crates/rp-modules" }

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }