[package]
name = "research-log-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # WebAssembly module

[dependencies]
# Core dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time (WASM-compatible)
uuid = { version = "1", features = ["v4", "serde"] }

# WASM-specific
wasm-bindgen = "0.2"

[features]
default = []

# We don't use dev-dependencies in WASM modules