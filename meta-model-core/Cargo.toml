[package]
name = "meta-model-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Property graph and storage
indexmap = "2.0"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# Abstraction layer support
once_cell = "1.20"
parking_lot = "0.12"

# Plugin support (future)
# wasmtime = "24.0"  # For WASM plugins
# libloading = "0.8"  # For dynamic libraries

# Format support
quick-xml = { version = "0.32", features = ["serialize"] } # For XML parsing
regex = "1.11"
nom = "7.1"  # For complex parsing
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"

[features]
default = ["builtin-abstractions"]
builtin-abstractions = []
plugin-support = []  # Enable when ready
wasm-plugins = []    # Enable when ready